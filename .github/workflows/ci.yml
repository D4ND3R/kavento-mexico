name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, tipos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verificación de tipos
        run: npm run type-check

      - name: Build de producción
        run: npm run build
        env:
          # Valor de ejemplo: el build no debe depender de secretos reales.
          NEXT_PUBLIC_WHATSAPP_NUMBER: "5215500000000"
          NEXT_PUBLIC_SITE_URL: "https://kavento.mx"
