<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="520" height="220" role="img" aria-label="Soluciones Digitales Kavento México">
  <title>Soluciones Digitales Kavento México</title>
  <defs>
    <linearGradient id="sun" x1="40" y1="190" x2="230" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EF6A24"/>
      <stop offset="0.55" stop-color="#F79A2A"/>
      <stop offset="1" stop-color="#FFC94A"/>
    </linearGradient>
    <linearGradient id="word" x1="150" y1="0" x2="500" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F5EFE6"/>
      <stop offset="0.46" stop-color="#F5EFE6"/>
      <stop offset="1" stop-color="#2FA8B8"/>
    </linearGradient>
  </defs>

  <circle cx="130" cy="112" r="94" fill="url(#sun)"/>

  <text x="152" y="76"
        font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="34" font-weight="700" font-style="italic"
        letter-spacing="-0.4" fill="url(#word)">Soluciones Digitales</text>

  <text x="150" y="150"
        font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="76" font-weight="800"
        letter-spacing="-1" fill="url(#word)">KAVENTO</text>

  <text x="500" y="190" text-anchor="end"
        font-family="Manrope, Inter, 'Segoe UI', system-ui, sans-serif"
        font-size="30" font-style="italic"
        fill="#2FA8B8">México</text>
</svg>
